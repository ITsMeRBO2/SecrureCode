rules:
  - id: securecode.cwe89.sql-injection
    mode: taint
    languages: [java]
    severity: ERROR
    message: >-
      Donnée utilisateur non assainie utilisée dans une requête SQL (injection SQL, CWE-89).
      Utiliser un PreparedStatement avec des paramètres liés.
    metadata:
      cwe: "CWE-89"
    pattern-sources:
      - pattern-either:
          - pattern: $R.getParameter(...)
          - pattern: $R.getParameterValues(...)
          - pattern: $R.getParameterMap(...)
          - pattern: $R.getParameterNames(...)
          - pattern: $R.getHeader(...)
          - pattern: $R.getHeaders(...)
          - pattern: $R.getQueryString(...)
          - pattern: $R.getCookies(...)
          - pattern: $R.getInputStream(...)
          - pattern: $R.getTheParameter(...)
          - pattern: $R.getTheValue(...)
          - pattern: $R.getTheCookies(...)
          - pattern: (Scanner $SC).next(...)
          - pattern: (Scanner $SC).nextLine(...)
          - pattern: args[...]
          - pattern: $ARGS[$I]
    pattern-sanitizers:
      - pattern-either:
          - pattern: $E.encodeForSQL(...)
          - pattern: $PS.setString(...)
          - pattern: $PS.setInt(...)
          - pattern: $PS.setLong(...)
          - pattern: $PS.setDouble(...)
          - pattern: $PS.setObject(...)
          - pattern: Integer.parseInt(...)
          - pattern: Long.parseLong(...)
    pattern-propagators:
      - pattern: $L.add($X)
        from: $X
        to: $L
      - pattern: $L.put($K, $X)
        from: $X
        to: $L
      - pattern: $L.append($X)
        from: $X
        to: $L
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $S.executeQuery($SQL, ...)
              - pattern: $S.execute($SQL, ...)
              - pattern: $S.executeUpdate($SQL, ...)
              - pattern: $S.executeLargeUpdate($SQL, ...)
              - pattern: $S.addBatch($SQL)
              - pattern: $C.prepareStatement($SQL, ...)
              - pattern: $C.prepareCall($SQL, ...)
              - pattern: $J.query($SQL, ...)
              - pattern: $J.queryForObject($SQL, ...)
              - pattern: $J.queryForList($SQL, ...)
              - pattern: $J.queryForMap($SQL, ...)
              - pattern: $J.queryForRowSet($SQL, ...)
              - pattern: $J.update($SQL, ...)
              - pattern: $J.batchUpdate($SQL, ...)
          - focus-metavariable: $SQL

  - id: securecode.cwe89.sql-concat
    languages: [java]
    severity: ERROR
    message: >-
      Requête SQL construite par concaténation dynamique (injection SQL, CWE-89).
      Utiliser un PreparedStatement avec des paramètres liés.
    metadata:
      cwe: "CWE-89"
    patterns:
      - pattern-either:
          - pattern: $S.executeQuery($X + $Y, ...)
          - pattern: $S.executeUpdate($X + $Y, ...)
          - pattern: $S.execute($X + $Y, ...)
          - pattern: $S.executeLargeUpdate($X + $Y, ...)
          - pattern: |
              $TYPE $Q = $X + $Y;
              ...
              $S.executeQuery($Q, ...);
          - pattern: |
              $TYPE $Q = $X + $Y;
              ...
              $S.executeUpdate($Q, ...);
          - pattern: |
              $TYPE $Q = $X + $Y;
              ...
              $S.execute($Q, ...);
      - pattern-not: $S.executeQuery("..." + "...", ...)
      - pattern-not: $S.executeUpdate("..." + "...", ...)
      - pattern-not: $S.execute("..." + "...", ...)
      - pattern-not: |
          $TYPE $Q = "..." + "...";
          ...
          $S.executeQuery($Q, ...);
      - pattern-not: |
          $TYPE $Q = "..." + "...";
          ...
          $S.executeUpdate($Q, ...);
      - pattern-not: |
          $TYPE $Q = "..." + "...";
          ...
          $S.execute($Q, ...);
